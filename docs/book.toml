[book]
authors = ["rsteube"]
language = "en"
src = "src"
title = "carapace"
description = "A multi-shell completion library and binary."

[output.html]
default-theme = "Mocha"
preferred-dark-theme = "Mocha"
additional-css = ["./theme/catppuccin.css", "./theme/custom.css"]
git-repository-url = "https://github.com/carapace-sh/carapace.sh"
edit-url-template = "https://github.com/carapace-sh/carapace.sh/edit/master/docs/{path}"

[output.html.fold]
enable = true

[preprocessor.asciinema]

#[output.linkcheck]
#follow-web-links = true
